name: Build Windows GPU EXE

on:
  workflow_dispatch: # Lets you trigger the build manually with a button click

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies (Strict DirectML GPU)
        run: |
          python -m pip install --upgrade pip
          pip install basic-pitch customtkinter pyinstaller
          pip uninstall -y onnxruntime
          pip install onnxruntime-directml

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller midi_extractor_gpu.py `
            --name=NeuralPitch_GPU `
            --noconfirm `
            --windowed `
            --collect-all=basic_pitch `
            --collect-all=customtkinter `
            --collect-all=onnxruntime `
            --collect-data=librosa `
            --copy-metadata=basic_pitch `
            --copy-metadata=librosa

      - name: Upload Compiled EXE for Download
        uses: actions/upload-artifact@v4
        with:
          name: NeuralPitch_GPU_Windows
          path: dist/NeuralPitch_GPU/
